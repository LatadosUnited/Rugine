[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Uma unica fonte de verdade para versoes. Com varios crates, deixar as
# versoes espalhadas nos manifestos e o jeito mais rapido de acabar com
# duas versoes de wgpu no mesmo binario.
[workspace.dependencies]
rugine-core = { path = "crates/rugine-core", version = "0.1.0" }
rugine-render = { path = "crates/rugine-render", version = "0.1.0" }
rugine-app = { path = "crates/rugine-app", version = "0.1.0" }
rugine-scene = { path = "crates/rugine-scene", version = "0.1.0" }
rugine-ui = { path = "crates/rugine-ui", version = "0.1.0" }

wgpu = "30.0.1"
winit = "0.30.13"
# Presa na 0.36 por causa da `egui_dock`, que e quem fornece o sistema de
# paineis encaixaveis e ainda nao acompanhou a 0.37. A 0.36 nao custa wgpu:
# a `egui-wgpu` 0.36.2 ja exige `wgpu = "30.0"`, a mesma da engine.
#
# Na 0.36 `default_fonts` ainda e feature padrao.
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
egui_dock = "0.21.1"
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
raw-window-handle = "0.6.2"
pollster = "1.0.1"
log = "0.4.34"
env_logger = "0.11.11"
anyhow = "1.0.104"
thiserror = "2.0.21"

# Builds de debug jogaveis: o codigo da engine fica em opt-level 1 (ainda
# depuravel), mas as dependencias vao a 3 — wgpu e naga dominam o tempo de
# frame em debug e nunca sao depuradas por nos.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
