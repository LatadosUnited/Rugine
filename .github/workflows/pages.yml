name: Site

# Publica o `site/` no GitHub Pages: https://latadosunited.github.io/Rugine/
#
# Roda so quando algo que muda o site chega no master. O `base` do Astro ja e
# /Rugine por padrao (astro.config.mjs), o caminho de um Pages de projeto, entao
# o build daqui nao precisa de SITE_BASE.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, e sem cancelar o que esta no meio: um deploy interrompido
# pode deixar o Pages servindo metade de uma versao.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar
        run: npm ci

      # O build e tambem a validacao da arvore: pre-requisito inexistente ou
      # fora de ordem derruba o deploy em vez de publicar um mapa errado.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
