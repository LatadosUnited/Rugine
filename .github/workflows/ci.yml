name: CI

# Nao roda a cada push de proposito: a primeira execucao mostrou que compilar
# wgpu, naga e egui em duas plataformas custa minutos demais para valer em todo
# commit. O caminho barato para checar o Linux e local, sem CI nenhum:
#
#     rustup target add x86_64-unknown-linux-gnu
#     cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
#
# `clippy` e `check` nao linkam, entao isso roda no Windows sem toolchain
# cruzada. O CI fica para antes de integrar algo e para quando se quiser a
# confirmacao de verdade.
#
# O codigo da engine fica em `engine/`; o `site/` nao passa pelo CI.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verificar:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Sem fail-fast de proposito: o Windows passando nao diz nada sobre o
      # Linux. Cancelar um porque o outro quebrou esconderia a resposta.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Todo `cargo` roda no workspace, que nao fica mais na raiz do repositorio.
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Sem cache, cada execucao recompila wgpu e naga do zero.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Formatacao e a mesma em toda plataforma; rodar duas vezes so gastaria
      # minuto de runner.
      - name: Formatacao
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # `--all-targets` ja compila binarios, testes e exemplos, entao um passo
      # separado de `cargo build` seria uma segunda compilacao inteira do
      # workspace — era o que mais pesava na primeira execucao.
      #
      # `--locked` faz falhar se o Cargo.lock estiver desatualizado, em vez de
      # atualiza-lo em silencio e testar outro conjunto de dependencias.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # O editor e o sandbox abrem janela e exigem GPU: o runner nao tem
      # display nem adaptador grafico. Os testes que rodam aqui sao os de CPU
      # (matematica e grafo de cena).
      - name: Testes
        run: cargo test --workspace --locked
